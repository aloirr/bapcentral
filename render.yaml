# Blueprint do Render da BAP Central web (T-0013).
# Texto proposto em web/RENDER.md (seção 2) do PR #17.
# Nenhum valor de segredo aqui: os segredos (sync: false) o Alexandre cria no painel
# (4 do site; 2 da Máxima no bap-visitas-maxima, T-0045, ADR 0004).
services:
  - type: web
    name: bap-central
    runtime: python
    plan: starter            # US$ 7, 512 MB [SUPOSIÇÃO: confirmar no painel]
    region: oregon           # [SUPOSIÇÃO: região não decidida pelo Alexandre; o padrão do Render é oregon]
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:criar_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    autoDeploy: true         # deploy a cada commit no main (R-20261124-210855-alexandre)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: America/Manaus
      - key: BAP_WEB_DADOS
        value: /var/data
      - key: BAP_WEB_PACOTE_MAX_MB
        value: "25"
      - key: SESSION_SECRET
        sync: false          # o Alexandre cria no painel
      - key: BAP_WEB_TOKEN
        sync: false
      - key: BAP_ADMIN_USUARIO
        sync: false
      - key: BAP_ADMIN_SENHA_INICIAL
        sync: false
      - key: BAP_VISITAS_TOKEN
        generateValue: true  # T-0045: o Render sorteia; só abre as rotas do cron (/api/visitas/trabalho e /rodada*)
    disk:
      name: bap-dados
      mountPath: /var/data
      sizeGB: 1

  # T-0045 (ADR 0004; contrato .coord/contratos/visitas-nuvem.md v1): visitas da Máxima.
  # Cron job à parte (D1 da ADR 0004): acorda de 10 em 10 min,
  # pergunta ao site se há trabalho (agenda das 06h00, botão, diagnóstico, teto do dia) e sai.
  # No Render, a senha da Máxima fica SÓ aqui, nunca no bap-central.
  - type: cron
    name: bap-visitas-maxima
    runtime: docker
    plan: standard           # 2 GB, 1 CPU, pago pelo tempo rodado [SUPOSIÇÃO: preço em docs/desenho/T-0045-render-yaml.md, §2.1]
    region: oregon           # a mesma do bap-central (rede privada)
    schedule: "*/10 10-23,0-1 * * *"   # UTC: de 10 em 10 min, das 06h00 às 21h50 de Manaus (UTC-4)
    dockerfilePath: ./nuvem/visitas/Dockerfile
    dockerContext: .
    autoDeploy: true
    buildFilter:             # só refaz a imagem quando o código dela muda
      paths:
        - nuvem/visitas/**
        - visitas_maxima.py
        - visitas_nucleo.py
        - relatorios_nucleo.py
        - bap_dados.py
        - requirements-visitas.txt
        - .dockerignore
    envVars:
      - key: TZ
        value: America/Manaus
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BAP_WEB_HOSTPORT
        fromService:
          type: web
          name: bap-central
          property: hostport
      - key: BAP_VISITAS_TOKEN
        fromService:         # o valor sorteado no bap-central [SUPOSIÇÃO: envVarKey aceito no cron]
          type: web
          name: bap-central
          envVarKey: BAP_VISITAS_TOKEN
      - key: BAP_MAXIMA_USUARIO
        sync: false          # o mesmo usuário da Máxima do notebook (D4 revista); o Alexandre preenche no painel
      - key: BAP_MAXIMA_SENHA
        sync: false          # a mesma senha do notebook; o Alexandre preenche no painel; só neste serviço
