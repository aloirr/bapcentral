{% extends "base.html" %}
{% block titulo %}Menu{% endblock %}
{% block corpo %}
<nav class="menu">
  {% for m in menu %}{% if m.href %}<a class="quadro" href="{{ m.href }}">{{ m.nome }}</a>{% else %}<span class="quadro indisp">{{ m.nome }}<small>{{ indisponivel }}</small></span>{% endif %}{% endfor %}
</nav>
{% endblock %}
